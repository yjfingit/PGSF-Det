[project]
name = "pgsf-det"
version = "2.0.0"
description = "Probabilistic geometry guided unregistered RGB-T detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.5.1",
    "torchvision==0.20.1",
    "ultralytics==8.4.154",
    "numpy==2.2.6",
    "pillow>=10,<13",
    "pyyaml>=6,<7",
    "tqdm>=4.66,<5",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
